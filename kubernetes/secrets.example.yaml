apiVersion: v1
kind: Secret
metadata:
  name: foodloop-secrets
  namespace: foodloop
type: Opaque
stringData:
  JWT_SECRET: "replace-from-sealed-secret-or-external-store"
  GEMINI_API_KEY_PRIMARY: "replace-from-external-store"
  GEMINI_API_KEY_BACKUP: "replace-from-external-store"
  MONGODB_URI: "mongodb://mongodb:27017/foodloop"
