apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: foodloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: foodloop-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: foodloop-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: foodloop
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080




