apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: foodloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: foodloop-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: foodloop
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001




