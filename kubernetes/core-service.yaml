apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: foodloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: foodloop/core-service:latest
          ports:
            - containerPort: 3002
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: foodloop
spec:
  selector:
    app: core-service
  ports:
    - port: 3002
      targetPort: 3002
