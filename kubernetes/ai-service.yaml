apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: foodloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: foodloop/ai-service:latest
          ports:
            - containerPort: 3003
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: foodloop
spec:
  selector:
    app: ai-service
  ports:
    - port: 3003
      targetPort: 3003
